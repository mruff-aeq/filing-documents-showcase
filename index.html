<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filing Documents Showcase</title>
<style>
  /* dark theme forced for everyone regardless of OS preference */
  :root {
    color-scheme: dark;
    --bg: #14171b; --panel: #1d222a; --ink: #e8ebee; --muted: #98a2ad;
    --line: #2e353d; --accent: #5da8e8; --accent-ink: #10141a; --chip: #262d35;
    --wash-workhorse: #1d2a38; --dot-workhorse: #5da8e8;
    --wash-liquidation: #281f38; --dot-liquidation: #b18ae8;
    --wash-lifecycle: #1c2e24; --dot-lifecycle: #6cc793;
    --wash-destructive: #32211b; --dot-destructive: #e08b62;
    --wash-amalgamation: #2f2917; --dot-amalgamation: #d9b45a;
    --wash-coop: #16302c; --dot-coop: #4fc7b0;
    --wash-firm: #2c2036; --dot-firm: #c58ae0;
    --wash-tbd: #202730; --dot-tbd: #66707c;
    --tbd: #8b96a3; --tbd-wash: #1f242b;
    --err: #e0685e; --err-wash: #331f1e;
    --stamp: #e8798b; --stamp-wash: #38222a;
    --ok: #6cc793; --ok-wash: #1c2e24;
    --warn: #d9b45a; --warn-wash: #2f2917;
    --gone: #9aa6b2; --gone-wash: #232830;
    --corr: #b18ae8; --corr-wash: #281f38;
    --rt-filing: #5da8e8; --rt-filing-wash: #1d2a38;
    --rt-filing2: #a5a0ee; --rt-filing2-wash: #232043;
    --rt-filing3: #e08b62; --rt-filing3-wash: #32211b;
    --rt-noa: #5ec9bf; --rt-noa-wash: #173029;
    --rt-cert: #e87bbb; --rt-cert-wash: #341f2b;
    --steps: #67cfe3; --steps-wash: #173038;
    --staff: #f0c264; --staff-wash: #332913;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 26px 32px 4px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 21px; }
  header h1 a { font-size: 13px; font-weight: normal; color: var(--accent);
                text-decoration: none; margin-left: 12px; vertical-align: 2px; }
  header h1 a:hover { text-decoration: underline; }
  header .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 32px 80px; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 18px; cursor: pointer; border: 1px solid transparent; border-bottom: none;
         border-radius: 9px 9px 0 0; color: var(--muted); font-weight: 600; font-size: 14px;
         background: none; font-family: inherit; position: relative; top: 1px; }
  .tab:hover { color: var(--ink); background: var(--chip); }
  .tab.active { color: var(--ink); background: var(--panel); border-color: var(--line); }
  .tab .tcount { font-weight: normal; margin-left: 7px; font-size: 12px; padding: 0 7px;
                 border-radius: 8px; background: var(--chip); color: var(--muted); }
  .tab.active .tcount { background: var(--accent); color: var(--accent-ink); }
  .tab.empty { color: var(--line); }
  .tab.empty:hover { color: var(--muted); }
  body.detail-open .tabs { display: none; }
  .emptyfam { color: var(--muted); padding: 46px 6px 20px; max-width: 640px; line-height: 1.6; }
  .emptyfam .big { color: var(--ink); font-weight: 600; font-size: 15px; display: block;
                   margin-bottom: 6px; }
  .cat { margin: 22px 0 10px; font-size: 12.5px; font-weight: 600; color: var(--muted);
         text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; cursor: pointer; transition: box-shadow .12s, transform .12s;
          position: relative; }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.10); transform: translateY(-1px);
                z-index: 30; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
                  background: var(--dot); border-radius: 10px 0 0 10px; }
  .tip { position: relative; }
  .tip:hover { z-index: 25; }
  .tip:hover::after { content: attr(data-tip); position: absolute;
                      left: var(--tip-shift, 0);
                      top: calc(100% + 6px); z-index: 20; background: #0c0f13;
                      color: #e8ebee; border: 1px solid var(--line); padding: 6px 10px;
                      border-radius: 6px; font-size: 12px; line-height: 1.4;
                      width: max-content; max-width: min(280px, calc(90vw - 12px));
                      white-space: normal;
                      font-weight: normal; font-family: -apple-system, BlinkMacSystemFont,
                      "Segoe UI", sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.4);
                      pointer-events: none; }
  .card.tbdcard { border-style: dashed; opacity: .82; }
  .card.tbdcard:hover { opacity: 1; }
  .card.tbdcard .biz { color: var(--muted); line-height: 1.45; }
  .card.errcard { border-color: var(--err); }
  .card.errcard .biz { color: var(--muted); line-height: 1.45; }
  .pill.err { background: var(--err-wash); color: var(--err); border-color: var(--err);
    font-weight: 700; }
  .errmeta { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .errpre { background: var(--err-wash); border: 1px solid var(--err); border-radius: 8px;
    padding: 14px; font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pill.tbd { background: var(--tbd-wash); color: var(--tbd); border-color: var(--tbd);
              font-weight: 600; letter-spacing: .03em; }
  .card h3 { margin: 0 0 6px; font-size: 14.5px; word-break: break-word; }
  .card .biz { font-size: 12.5px; color: var(--muted); }
  .card .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill { font-size: 11.5px; padding: 1px 8px; border-radius: 9px; background: var(--wash);
          border: 1px solid var(--line); }
  .pill.status { font-weight: 600; }
  .pill.docs { background: var(--chip); }
  .pill.rtype { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 10.5px; background: var(--chip); color: var(--muted); }
  .s-completed { background: var(--ok-wash); color: var(--ok); border-color: var(--ok); }
  .s-paid { background: var(--warn-wash); color: var(--warn); border-color: var(--warn); }
  .s-withdrawn { background: var(--gone-wash); color: var(--gone); border-color: var(--gone); }
  .s-corrected { background: var(--corr-wash); color: var(--corr); border-color: var(--corr); }
  .rt-filing { background: var(--rt-filing-wash); color: var(--rt-filing);
               border-color: var(--rt-filing); }
  .rt-filing-2 { background: var(--rt-filing2-wash); color: var(--rt-filing2);
                 border-color: var(--rt-filing2); }
  .rt-filing-3 { background: var(--rt-filing3-wash); color: var(--rt-filing3);
                 border-color: var(--rt-filing3); }
  .rt-noa { background: var(--rt-noa-wash); color: var(--rt-noa); border-color: var(--rt-noa); }
  .rt-cert { background: var(--rt-cert-wash); color: var(--rt-cert); border-color: var(--rt-cert); }
  a.pill.payloadlink { background: var(--chip); text-decoration: none; font-weight: 600;
    vertical-align: middle; margin-left: 8px; cursor: pointer; }
  a.pill.payloadlink:hover { background: var(--wash); }
  .pill.steps { background: var(--steps-wash); color: var(--steps);
                border-color: var(--steps); font-weight: 600; }
  .pill.stamp, .stampbadge { background: var(--stamp-wash); border-color: var(--stamp);
                             color: var(--stamp); font-weight: 600; }
  .pill.staffdoc, .staffbadge { background: var(--staff-wash); border-color: var(--staff);
                                color: var(--staff); font-weight: 600; }
  .staffbadge { display: inline-block; font-size: 11px; padding: 1px 8px;
                border: 1px solid var(--staff); border-radius: 9px; margin-left: 8px; }
  .stampbadge { display: inline-block; font-size: 11px; padding: 1px 8px;
                border: 1px solid var(--stamp); border-radius: 9px; margin-left: 8px;
                vertical-align: 1px; }
  .srcbadge { display: inline-block; font-size: 11px; padding: 1px 8px; color: var(--muted);
              border: 1px solid var(--line); border-radius: 9px; background: var(--chip);
              margin-left: 8px; vertical-align: 1px; font-weight: normal; }
  /* detail view */
  .detail { display: none; }
  body.detail-open .grid-view { display: none; }
  body.detail-open .detail { display: block; }
  .back { background: none; border: 1px solid var(--line); color: var(--ink);
          border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit;
          margin-bottom: 18px; }
  .back:hover { background: var(--chip); }
  .detail h2 { margin: 0 0 4px; font-size: 20px; }
  .detail .desc { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 18px 20px; margin-bottom: 26px; }
  .fcard h3 { margin: 0 0 2px; font-size: 16px; }
  .phasehdr { font-size: 14px; margin: 22px 0 0; padding-top: 14px;
              border-top: 1px solid var(--line); }
  .phasehdr:first-of-type { border-top: 0; padding-top: 4px; }
  .stepno { display: inline-block; background: var(--accent); color: var(--accent-ink);
            font-size: 11.5px; font-weight: 600; border-radius: 9px; padding: 1px 9px;
            margin-right: 6px; vertical-align: 2px; }
  .badge { display: inline-block; background: var(--chip); border: 1px solid var(--line);
           border-radius: 10px; padding: 1px 9px; font-size: 12px; margin-left: 8px;
           vertical-align: 2px; }
  table.info { border-collapse: collapse; margin: 10px 0 4px; font-size: 13px; }
  table.info td { padding: 2px 18px 2px 0; }
  table.info td:first-child { color: var(--muted); }
  .doc { margin-top: 20px; }
  .doc h4 { font-size: 13.5px; margin: 0 0 6px; }
  .doc h4 a { color: var(--accent); text-decoration: none; font-weight: normal;
              margin-left: 10px; font-size: 12.5px; }
  .doc iframe { width: 100%; height: 74vh; border: 1px solid var(--line);
                border-radius: 6px; background: #fff; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>

  ['certifiedRules', 'certifiedMemorandum', 'affidavit'].includes(label) ||
  label.startsWith('staticDocuments');

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderTabs() {
  tabBar.innerHTML = FAMILIES.map(f => {
    const cov = COVERAGE[f.key] || [0, 0];
    const cls = `tab${f.key === activeFamily ? ' active' : ''}${cov[0] ? '' : ' empty'}`;
    return `<button class="${cls}" onclick="selectFamily('${f.key}')" `
         + `title="${cov[0]} of ${cov[1]} allowable filing types captured">${esc(f.label)}`
         + `<span class="tcount">${cov[0]}/${cov[1]}</span></button>`;
  }).join('');
}

function selectFamily(key) {
  activeFamily = key;
  renderTabs();
  renderGrid();
}

function renderGrid() {
  const fam = FAMILIES.find(f => f.key === activeFamily);
  const inFamily = CARDS.filter(c => c.family === activeFamily);
  if (!inFamily.length) {
    gridView.innerHTML = `<div class="emptyfam"><span class="big">`
      + `No harvested documents for ${esc(fam.label)} yet.</span>${esc(fam.note)}</div>`;
    return;
  }
  let html = '';
  for (const [cat, label] of Object.entries(CATEGORIES)) {
    const cards = inFamily.filter(c => c.category === cat)
      .sort((a, b) => ((a.placeholder || a.error) ? 1 : 0) - ((b.placeholder || b.error) ? 1 : 0)
                      || a.name.localeCompare(b.name));
    if (!cards.length) continue;
    html += `<div class="cat">${esc(label)}</div><div class="grid">`;
    cards.forEach(c => {
      const i = CARDS.indexOf(c);
      if (c.error) {
        html += `<div class="card errcard" style="--dot: var(--err); --wash: var(--err-wash)"
                      onclick="openCard(${i})">
          <h3>${esc(c.name)}</h3>
          <div class="biz">${esc(c.description)}</div>
          <div class="row"><span class="pill err">error: ${esc(c.error.status)}</span></div>
        </div>`;
        return;
      }
      if (c.placeholder) {
        html += `<div class="card tbdcard" style="--dot: var(--dot-tbd); --wash: var(--wash-tbd)"
                      onclick="openCard(${i})">
          <h3>${esc(c.name)}</h3>
          <div class="biz">${esc(c.description)}</div>
          <div class="row"><span class="pill tbd">TBD &middot; not captured</span></div>
        </div>`;
        return;
      }
      const nDocs = c.filings.reduce((n, f) => n + f.documents.length, 0);
      const nStamped = c.filings.reduce(
        (n, f) => n + f.documents.filter(d => d.stampedOnDownload).length, 0);
      const nStaff = c.filings.reduce(
        (n, f) => n + f.documents.filter(d => isStaffUploaded(d.label)).length, 0);
      const rtypes = [...new Set(c.filings.flatMap(f =>
        f.documents.map(d => d.reportType).filter(Boolean)))];
      html += `<div class="card" style="--dot: var(--dot-${cat}); --wash: var(--wash-${cat})"
                    onclick="openCard(${i})">
        <h3>${esc(c.name)}</h3>
        <div class="biz">${esc(c.description) || 'no filing captured'}</div>
        <div class="row">
          <span class="pill docs">${nDocs} PDF${nDocs === 1 ? '' : 's'}</span>
          ${rtypes.map(t => `<span class="pill rtype tip rt-${t.toLowerCase()}" data-tip="${esc(RT_TIPS[t] || '')}">${esc(t)}</span>`).join('')}
          ${nStamped ? `<span class="pill stamp">${nStamped} stamped on download</span>` : ''}
          ${nStaff ? `<span class="pill staffdoc">${nStaff} staff uploaded</span>` : ''}
          ${(() => { const n = c.phases ? c.phases.length : c.filings.length;
             return n > 1 ? `<span class="pill steps">${n} filing steps</span>` : ''; })()}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  gridView.innerHTML = html;
}

function openCard(i) {
  const c = CARDS[i];
  if (c.family && c.family !== activeFamily) { activeFamily = c.family; renderTabs(); renderGrid(); }
  const payloadLink = c.payload
    ? `<a class="pill payloadlink tip" target="_blank" rel="noopener"
         data-tip="Request payload body (JSON) — opens on GitHub"
         href="https://github.com/mruff-aeq/filing-documents-showcase/blob/main/payloads/${esc(c.payload)}">
         payload example &nearr;</a>`
    : '';
  let html = `<button class="back" onclick="closeCard()">&larr; All filings</button>
              <h2>${esc(c.name)} ${payloadLink}</h2>
              ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ''}`;
  if (c.error)
    html += `<div class="fcard">
      <h3><span class="pill err">HTTP ${esc(c.error.status)}</span> API response
          <span class="errmeta">captured ${esc(c.error.captured)}</span></h3>
      <pre class="errpre">${esc(JSON.stringify(c.error.response, null, 2))}</pre>
    </div>`;
  else if (c.placeholder)
    html += `<p class="empty">Not captured in a suite run yet — this filing is allowable for `
          + `${esc(c.family)} entities per legal-api authz, but no example has been run.</p>`;
  else if (!c.filings.length) html += `<p class="empty">No filing captured for this step.</p>`;
  c.filings.forEach((f, idx) => {
    const step = c.filings.length > 1 ? `<span class="stepno">Step ${idx + 1}</span> ` : '';
    html += `<div class="fcard">
      <h3>${step}${esc(f.displayName || f.type)}</h3>
      <table class="info">
        <tr><td>Business</td><td>${esc(f.identifier)} — ${esc(f.legalName)}
            (${esc(f.bizState)})</td></tr>
        <tr><td>Filing ID</td><td>${esc(f.filingId)}</td></tr>
        <tr><td>Filing type</td><td>${esc(f.type)}</td></tr>
        <tr><td>Documents</td><td>${f.documents.length}</td></tr>
      </table>`;
    const renderDoc = d => {
      const src = d.reportType
        ? `DRS &middot; ${esc(d.reportType)}${d.drsId ? '' : ' (server-resolved)'}`
        : 'generated at download';
      const stamp = d.stampedOnDownload
        ? `<span class="stampbadge tip" data-tip="Certified-copy stamp applied at download time (DRS certifiedCopy=true) — verified present in this PDF">&#9873; DRS stamp on download</span>`
        : '';
      const staff = isStaffUploaded(d.label)
        ? `<span class="staffbadge tip" data-tip="This document originated as a staff upload — in production it is attached by hand (manual notebook process), not generated by the report service. Content issues here are human-entered data, not a generator bug.">&#128100; staff uploaded</span>`
        : '';
      return `<div class="doc"><h4>${esc(d.label)}
        <span class="srcbadge tip ${d.reportType ? 'rt-' + d.reportType.toLowerCase() : ''}" data-tip="${esc(d.reportType ? (RT_TIPS[d.reportType] || '') : 'Rendered fresh by the API at download time — not stored in the DRS.')}">${src}</span>${stamp}${staff}
        <a href="${esc(d.path)}" target="_blank">open in new tab &nearr;</a></h4>
        <iframe src="${esc(d.path)}" title="${esc(d.label)}" loading="lazy"></iframe></div>`;
    };
    const sorted = [...f.documents].sort((a, b) => a.label.localeCompare(b.label));
    if (c.phases && c.filings.length === 1) {
      const claimed = new Set(c.phases.flatMap(p => p.docs));
      c.phases.forEach((p, pi) => {
        const docs = sorted.filter(d => p.docs.includes(d.label));
        html += `<h4 class="phasehdr"><span class="stepno">Step ${pi + 1}</span> ${esc(p.title)}</h4>`;
        if (docs.length) docs.forEach(d => { html += renderDoc(d); });
        else html += `<p class="empty">${esc(p.note || 'No documents yet.')}</p>`;
      });
      sorted.filter(d => !claimed.has(d.label)).forEach(d => { html += renderDoc(d); });
    } else {
      if (!f.documents.length)
        html += `<p class="empty">No output documents for this filing type.</p>`;
      sorted.forEach(d => { html += renderDoc(d); });
    }
    html += `</div>`;
  });
  detailView.innerHTML = html;
  document.body.classList.add('detail-open');
  window.scrollTo(0, 0);
  location.hash = 'card-' + i;
  placeTips();
}

function closeCard() {
  document.body.classList.remove('detail-open');
  detailView.innerHTML = '';
  history.replaceState(null, '', location.pathname);
}

window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#card-(\d+)$/);
  if (m && CARDS[+m[1]]) openCard(+m[1]); else closeCard();
});

// Pre-compute each tooltip's horizontal shift so the bubble stays inside the viewport.
// Done at render time (not on hover events) — touch browsers don't reliably fire
// pointerenter, and card positions don't change after layout anyway.
function shiftTip(el) {
  const limit = window.innerWidth * 0.90;  // bubbles stay out of the last 10% of viewport
  const bubbleW = Math.min(280, limit - 12);
  const shift = Math.min(0, (limit - bubbleW) - el.getBoundingClientRect().left);
  el.style.setProperty('--tip-shift', Math.round(shift) + 'px');
}
function placeTips() {
  document.querySelectorAll('.tip').forEach(shiftTip);
}
window.addEventListener('resize', placeTips);
// Also recompute just-in-time on interaction — mouseover/touchstart bubble reliably
// everywhere (pointerenter does not fire on tap in some mobile browsers).
['mouseover', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, e => {
    const t = e.target.closest && e.target.closest('.tip');
    if (t) shiftTip(t);
  }, {passive: true}));

renderTabs();
renderGrid();
placeTips();
const m = location.hash.match(/^#card-(\d+)$/);
if (m && CARDS[+m[1]]) openCard(+m[1]);
</script>
</body>
</html>
